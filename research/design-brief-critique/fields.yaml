# Fields for critical evaluation of A(DAI) Design Brief claims

Claim Assessment:
  - name: claim_summary
    description: "Concise restatement of the brief's claim being evaluated"
    detail_level: brief

  - name: claim_strength
    description: "Rating of claim strength: strong / moderate / weak / unsupported. With one-line justification."
    detail_level: brief

  - name: supporting_evidence
    description: "Evidence from research that supports or validates the claim. Include specific projects, papers, or precedents."
    detail_level: detailed

  - name: counter_evidence
    description: "Evidence that challenges, complicates, or contradicts the claim. Include specific failures, critiques, or counterexamples."
    detail_level: detailed

  - name: blind_spots
    description: "What the brief fails to consider or acknowledge. Assumptions that go unexamined."
    detail_level: detailed

Comparable Projects:
  - name: closest_precedents
    description: "2-5 most relevant comparable projects or systems, with brief description of what they achieved and where they failed"
    detail_level: moderate

  - name: lessons_from_failures
    description: "Specific lessons from failed or stalled comparable projects that A(DAI) should learn from"
    detail_level: detailed

  - name: differentiation_assessment
    description: "Is A(DAI)'s claimed differentiation real? What is genuinely novel vs already attempted?"
    detail_level: moderate

Technical & Practical Risks:
  - name: implementation_risks
    description: "Concrete technical, organizational, or adoption risks for this aspect of the brief"
    detail_level: detailed

  - name: dependency_assumptions
    description: "What must be true for this claim to hold? Hidden dependencies and preconditions."
    detail_level: moderate

  - name: timeline_reality_check
    description: "Is the implied timeline (functional by Art Basel June 2026) realistic for this component?"
    detail_level: brief

Recommendations:
  - name: suggested_revisions
    description: "Specific suggested changes to the brief to strengthen this claim or address identified weaknesses"
    detail_level: detailed

  - name: questions_for_team
    description: "Critical questions the founding team should answer before proceeding"
    detail_level: moderate

Sources:
  - name: key_sources
    description: "3-8 most important sources consulted, with URLs where available"
    detail_level: moderate
