  # ============================================================
  # CONCEPTS / TENSIONS — 18
  # ============================================================
  - name: "The Digital Arts Paradox"
    type: concept
    notes: "Most accessible medium + most exclusionary. Laptop to museum. No ladder between."

  - name: "Singular vs. Plural"
    type: concept
    notes: "'Digital art' vs 'the digital arts'. Objects vs ecologies."

  - name: "Object vs. Process"
    type: concept
    notes: "Art history built for persistent objects. Digital art is process-based, ephemeral."

  - name: "Market vs. Ecosystem"
    type: concept
    notes: "Market signals are real but biased. Parasitic in both directions."

  - name: "Western Canon vs. Global Lineages"
    type: concept
    notes: "Canon begins Stuttgart 1965. But pre-colonial computational aesthetics exist."

  - name: "The Four Structural Permissions"
    type: concept
    notes: "Artists inform narrative, define practice, define boundaries, inform markets."

  - name: "Cosmotechnics"
    type: concept
    notes: "Yuk Hui. Multiple culturally specific relationships between technology and cosmology."

  - name: "Post-digital theory"
    type: concept
