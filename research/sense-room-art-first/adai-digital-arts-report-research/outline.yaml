topic: "ADAI Digital Arts — Critical History & Knowledge Graph"
source: "adai_digital_arts_report.pdf + web research supplement (March 2026)"
description: >
  Comprehensive research database covering the digital arts field from 1950s to present.
  Based on 'The Digital Arts: A Critical Theory & Comprehensive History' report,
  supplemented with web research through March 2026. Covers 8 entity types across
  3 historical eras, 12 artistic traditions, 150+ practitioners, 40+ artworks,
  30+ institutions, and key concepts, events, platforms, and curators.

execution:
  batch_size: 8
  items_per_agent: 5
  output_dir: ./results

items:

