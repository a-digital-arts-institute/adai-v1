topic: "ADAI Digital Arts — Critical History & Knowledge Graph"
description: >
  Field definitions for the A(DAI) knowledge graph database.
  Covers 8 entity types with comprehensive fields for each.
  Designed for Gio's database build.

# ============================================================
# PRACTITIONER FIELDS
# ============================================================
practitioner:
  identity:
    - name: name
      type: string
      required: true
      description: "Full name or collective name"
      detail_level: brief

    - name: birth_year
      type: integer
      description: "Year of birth (null for collectives)"
      detail_level: brief

    - name: death_year
      type: integer
      description: "Year of death (null if living)"
      detail_level: brief

    - name: nationality
      type: string
      description: "Nationality or nationalities"
      detail_level: brief

    - name: based_in
      type: string
      description: "Current location / city of practice"
      detail_level: moderate

    - name: is_collective
      type: boolean
      description: "Whether this is a collective/duo/group rather than individual"
      detail_level: brief

    - name: collective_members
      type: array
      description: "If collective, list of member names"
      detail_level: moderate

  classification:
    - name: primary_tradition
      type: enum
      values:
        - algorithmic_generative
        - immersive_spatial
        - net_art_software
        - performance_live_coding
        - global_decolonial
        - crypto_blockchain
        - video_electronic
        - ai_machine_learning
        - glitch_post_digital
        - robotic_physical
        - bio_digital
        - data_visualization
        - video_games_as_art
        - theory
        - curator
      required: true
      description: "Primary tradition assignment from the 12+1 taxonomy"
      detail_level: brief

    - name: secondary_traditions
      type: array
      description: "Additional traditions the practitioner works across"
      detail_level: moderate

    - name: era
      type: enum
      values:
        - pioneers
        - network_expansion
        - eruption_integration
      description: "Primary historical era of emergence"
      detail_level: brief

    - name: canonical_status
      type: enum
      values:
        - canonical
        - significant
        - emerging
        - historical
        - contested
      description: "Position in the field's canon"
      detail_level: moderate

  practice:
    - name: key_works
      type: array
      description: "List of most significant works/projects"
      detail_level: moderate

    - name: medium_description
      type: string
      description: "Description of primary medium and approach"
      detail_level: moderate

    - name: programming_languages
      type: array
      description: "Languages and tools used (Processing, p5.js, Python, GLSL, TouchDesigner, etc.)"
      detail_level: moderate

    - name: ai_relationship
      type: enum
      values:
        - creates_ai_systems
        - uses_ai_as_tool
        - critiques_ai
        - pre_ai_digital
        - hybrid
        - not_applicable
      description: "How the practitioner relates to AI"
      detail_level: moderate

    - name: theoretical_contributions
      type: string
      description: "Key theoretical or conceptual contributions to the field"
      detail_level: detailed

    - name: biography_summary
      type: string
      description: "2-3 sentence biography"
      detail_level: detailed

  institutional:
    - name: institutional_affiliations
      type: array
      description: "Museums, universities, labs, platforms affiliated with"
      detail_level: moderate

    - name: museum_collections
      type: array
      description: "Permanent collections holding the practitioner's work (MoMA, Pompidou, etc.)"
      detail_level: moderate

    - name: mentorship_lineage
      type: object
      description: "Who taught them, who they taught, educational roles"
      detail_level: detailed

    - name: collaborative_entities
      type: array
      description: "Studios, duos, collectives they are part of"
      detail_level: moderate

  market:
    - name: market_significance
      type: string
      description: "Key market moments, sales records, auction history"
      detail_level: moderate

    - name: market_tier
      type: enum
      values:
        - blue_chip
        - mid_career
        - emerging
        - community_native
        - non_commercial
      description: "Market position classification"
      detail_level: moderate

    - name: on_chain_presence
      type: object
      properties:
        - chains: "array — Ethereum, Tezos, Solana, etc."
        - platforms: "array — Art Blocks, Feral File, fx(hash), etc."
        - notable_collections: "array — specific on-chain collections"
      description: "Blockchain presence and platform affiliations"
      detail_level: moderate

  geographic:
    - name: geographic_tradition
      type: array
      description: "Scene(s) they are active in (New York, London, Berlin, Lagos, etc.)"
      detail_level: moderate

  provenance:
    - name: source
      type: enum
      values:
        - report
        - web_supplement
        - manual
      description: "Where this data came from"
      detail_level: brief

    - name: last_verified
      type: date
      description: "Date information was last verified"
      detail_level: brief

# ============================================================
# ARTWORK FIELDS
# ============================================================
artwork:
  identity:
    - name: title
      type: string
      required: true
      description: "Title of the work"
      detail_level: brief

    - name: artist
      type: string
      required: true
      description: "Artist name (references practitioner)"
      detail_level: brief

    - name: year
      type: integer
      required: true
      description: "Year of creation or first exhibition"
      detail_level: brief

  classification:
    - name: medium
      type: string
      description: "Medium description (generative code, immersive installation, video, etc.)"
      detail_level: moderate

    - name: tradition
      type: enum
      values:
        - algorithmic_generative
        - immersive_spatial
        - net_art_software
        - performance_live_coding
        - global_decolonial
        - crypto_blockchain
        - video_electronic
        - ai_machine_learning
        - glitch_post_digital
        - robotic_physical
        - bio_digital
        - data_visualization
        - video_games_as_art
      description: "Primary tradition"
      detail_level: brief

    - name: era
      type: enum
      values:
        - pioneers
        - network_expansion
        - eruption_integration
      description: "Historical era"
      detail_level: brief

    - name: interactivity_type
      type: enum
      values:
        - none
        - viewer_responsive
        - participatory
        - generative_live
        - game_based
        - breath_based
        - network_based
      description: "Type of audience engagement"
      detail_level: moderate

  content:
    - name: description
      type: string
      description: "What the work is and does"
      detail_level: moderate

    - name: significance
      type: string
      description: "Why this work matters in the field's history"
      detail_level: detailed

    - name: technical_details
      type: string
      description: "Technical implementation details"
      detail_level: detailed

    - name: ai_model_used
      type: string
      description: "Which AI model(s) used if applicable"
      detail_level: moderate

    - name: dependencies
      type: array
      description: "Technical dependencies (software, hardware, blockchain, external data)"
      detail_level: detailed

  market_and_collection:
    - name: collection_or_platform
      type: string
      description: "Where the work lives (museum, platform, blockchain)"
      detail_level: moderate

    - name: market_data
      type: object
      properties:
        - sale_price: string
        - auction_house: string
        - sale_date: date
      description: "Sale/auction data if applicable"
      detail_level: moderate

    - name: edition_structure
      type: string
      description: "1/1, limited edition, open edition, generative series (with count)"
      detail_level: moderate

    - name: on_chain_status
      type: enum
      values:
        - fully_on_chain
        - partially_on_chain
        - off_chain
        - not_applicable
      description: "Whether artwork data is stored on blockchain"
      detail_level: moderate

    - name: exhibition_history
      type: array
      description: "List of exhibitions where shown"
      detail_level: detailed

  preservation:
    - name: preservation_status
      type: enum
      values:
        - actively_preserved
        - at_risk
        - lost
        - degrading
        - permanent_collection
        - on_chain_preserved
      description: "Current preservation state"
      detail_level: moderate

  provenance:
    - name: source
      type: enum
      values: [report, web_supplement, manual]
      detail_level: brief

# ============================================================
# INSTITUTION FIELDS
# ============================================================
institution:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: institution_category
      type: enum
      values:
        - museum
        - gallery
        - platform
        - foundation
        - incubator
        - festival
        - preservation
        - educational
        - research_lab
        - auction_house
        - publication
        - journal
        - venue
        - organization
        - collection
        - school
        - residency
      required: true
      description: "Primary type of institution"
      detail_level: brief

    - name: founded_year
      type: integer
      description: "Year founded"
      detail_level: brief

    - name: location
      type: string
      description: "City/country or 'Online'"
      detail_level: brief

  significance:
    - name: significance
      type: string
      description: "Why this institution matters"
      detail_level: moderate

    - name: key_figures
      type: array
      description: "Key people associated (references practitioners)"
      detail_level: moderate

    - name: digital_art_commitment_level
      type: enum
      values:
        - dedicated_100_percent
        - significant_program
        - occasional_exhibition
        - collection_only
      description: "How central digital art is to the institution"
      detail_level: moderate

  operations:
    - name: current_status
      type: enum
      values:
        - active
        - closed
        - merged
        - rebranded
        - planned
      description: "Current operational status"
      detail_level: brief

    - name: chain_affiliation
      type: array
      description: "Which blockchain(s) the institution operates on"
      detail_level: moderate

    - name: preservation_capacity
      type: boolean
      description: "Whether institution has digital preservation infrastructure"
      detail_level: moderate

    - name: funding_model
      type: enum
      values:
        - commercial
        - grants
        - donations
        - token_sales
        - institutional
        - membership
        - mixed
      description: "How the institution is funded"
      detail_level: moderate

  provenance:
    - name: source
      type: enum
      values: [report, web_supplement, manual]
      detail_level: brief

# ============================================================
# CONCEPT FIELDS
# ============================================================
concept:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: description
      type: string
      required: true
      description: "What this concept means"
      detail_level: moderate

  context:
    - name: origin
      type: string
      description: "Where and when this concept emerged"
      detail_level: moderate

    - name: key_theorists
      type: array
      description: "People who developed or articulate this concept"
      detail_level: moderate

    - name: related_tensions
      type: array
      description: "Other concepts/tensions this relates to"
      detail_level: moderate

    - name: relevance_to_adai
      type: string
      description: "Why this concept matters for the A(DAI) framework"
      detail_level: detailed

    - name: legal_status
      type: string
      description: "Whether the concept has legal implications or active litigation"
      detail_level: moderate

    - name: temporal_relevance
      type: enum
      values:
        - historically_fixed
        - actively_evolving
        - emerging
      description: "Whether concept is still being defined"
      detail_level: moderate

  provenance:
    - name: source
      type: enum
      values: [report, web_supplement, manual]
      detail_level: brief

# ============================================================
# TRADITION FIELDS
# ============================================================
tradition:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: era_span
      type: string
      description: "Time range (e.g. 'Pioneers — Present')"
      detail_level: brief

    - name: artist_count
      type: integer
      description: "Number of practitioners in this tradition"
      detail_level: brief

  content:
    - name: description
      type: string
      description: "What defines this tradition"
      detail_level: moderate

    - name: key_practitioners
      type: array
      description: "Most significant practitioners (references practitioner names)"
      detail_level: moderate

    - name: defining_works
      type: array
      description: "Works that define this tradition (references artwork titles)"
      detail_level: moderate

    - name: institutional_context
      type: array
      description: "Key institutions for this tradition"
      detail_level: moderate

  provenance:
    - name: source
      type: enum
      values: [report, web_supplement, manual]
      detail_level: brief

# ============================================================
# EVENT FIELDS
# ============================================================
event:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: year
      type: integer
      required: true
      detail_level: brief

    - name: location
      type: string
      detail_level: brief

  classification:
    - name: event_category
      type: enum
      values:
        - exhibition
        - auction
        - acquisition
        - legal_ruling
        - platform_launch
        - festival
        - symposium
        - fair_sector_launch
        - institutional_founding
        - shutdown
      description: "Type of event"
      detail_level: brief

  content:
    - name: organizer
      type: string
      description: "Who organized the event"
      detail_level: moderate

    - name: significance
      type: string
      description: "Why this event matters"
      detail_level: moderate

    - name: participants
      type: array
      description: "Key participants (references practitioner names)"
      detail_level: moderate

    - name: market_impact_data
      type: object
      properties:
        - sales_total: string
        - attendance: integer
        - num_exhibitors: integer
      description: "Quantitative measures"
      detail_level: moderate

    - name: media_coverage_volume
      type: string
      description: "Level of press coverage and controversy"
      detail_level: moderate

  provenance:
    - name: source
      type: enum
      values: [report, web_supplement, manual]
      detail_level: brief

# ============================================================
# PLATFORM / TOOL FIELDS
# ============================================================
platform:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: platform_type
      type: enum
      values:
        - creative_coding_framework
        - marketplace
        - blockchain
        - hardware
        - ai_tool
        - historical_hardware
        - preservation_tool
        - provenance_system
      description: "Type of platform or tool"
      detail_level: brief

    - name: release_year
      type: integer
      detail_level: brief

  content:
    - name: creators
      type: array
      description: "Who created this platform"
      detail_level: moderate

    - name: significance
      type: string
      description: "Why this platform matters"
      detail_level: moderate

    - name: current_status
      type: enum
      values:
        - active
        - discontinued
        - historical
        - beta
      detail_level: brief

    - name: community_size
      type: string
      description: "Approximate community or user base"
      detail_level: moderate

    - name: open_source
      type: boolean
      description: "Whether the platform is open source"
      detail_level: brief

  provenance:
    - name: source
      type: enum
      values: [report, web_supplement, manual]
      detail_level: brief

# ============================================================
# ERA FIELDS
# ============================================================
era:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: date_range
      type: string
      required: true
      detail_level: brief

  content:
    - name: defining_developments
      type: array
      description: "Key developments that define this era"
      detail_level: moderate

    - name: key_figures
      type: array
      description: "Most significant practitioners of this era"
      detail_level: moderate

    - name: institutional_context
      type: string
      description: "Institutional landscape during this era"
      detail_level: detailed

# ============================================================
# MARKET DATA FIELDS
# ============================================================
market_data:
  identity:
    - name: name
      type: string
      required: true
      detail_level: brief

    - name: value
      type: string
      required: true
      detail_level: brief

  content:
    - name: date_or_period
      type: string
      description: "When this data point applies"
      detail_level: brief

    - name: source
      type: string
      description: "Data source (DappRadar, Art Basel/UBS, etc.)"
      detail_level: brief

    - name: notes
      type: string
      description: "Context for the data point"
      detail_level: moderate

# ============================================================
# CROSS-ENTITY FIELDS (applicable to multiple types)
# ============================================================
cross_entity:
  - name: controversy_index
    type: enum
    values: [none, minor, significant, major]
    description: "How contested/debated the entity is"
    applicable_to: [practitioner, artwork, institution, event]

  - name: preservation_status
    type: enum
    values: [actively_preserved, at_risk, lost, degrading, on_chain, not_applicable]
    description: "Current preservation state"
    applicable_to: [artwork, platform, institution]

  - name: community_governance
    type: boolean
    description: "Whether entity involves DAO/on-chain voting/collective governance"
    applicable_to: [practitioner, institution, platform, artwork]

  - name: funding_model
    type: enum
    values: [commercial, grants, donations, token_sales, institutional, membership, mixed]
    description: "How entity is funded"
    applicable_to: [institution, platform, event]

# ============================================================
# UNCERTAIN FIELDS (reserved, auto-filled during deep research)
# ============================================================
uncertain:
  - practitioner.birth_year: "Many crypto/blockchain artists have undisclosed birth years"
  - practitioner.nationality: "Some anonymous practitioners (Pak, XCOPY birth details)"
  - artwork.market_data: "Secondary market data often incomplete"
  - institution.founded_year: "Some institutions evolved gradually without clear founding"
  - platform.community_size: "Active user counts fluctuate and are often unreported"
  - practitioner.market_tier: "Subjective classification, context-dependent"
