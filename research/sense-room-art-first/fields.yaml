topic: "Art-First Sense Room: Artists, Practices & Infrastructure for Graph-Curated Generative Exhibition"

fields:
  basic_info:
    description: "Core identification"
    fields:
      - name: name
        description: "Full name of artist, collective, platform, or project"
        detail_level: brief
      - name: type
        description: "artist | collective | platform | institution | project | artwork | theorist | report"
        detail_level: brief
      - name: active_years
        description: "Period of activity (e.g., 2015-present)"
        detail_level: brief
      - name: location
        description: "Primary base(s) of operation"
        detail_level: brief
      - name: url
        description: "Primary web presence"
        detail_level: brief

  practice_description:
    description: "What they make and how they work"
    fields:
      - name: medium
        description: "Primary medium/media (e.g., generative video, installation, sound, software, writing)"
        detail_level: brief
      - name: practice_summary
        description: "1-2 sentence description of their practice"
        detail_level: moderate
      - name: methodology
        description: "How they work — process, tools, collaborations, conceptual approach"
        detail_level: detailed

  relevance_to_sense_room:
    description: "Specific connection to A(DAI)'s art-first Sense room concept"
    fields:
      - name: relevance_summary
        description: "1-2 sentences: why this item matters for a graph-curated generative exhibition where art is primary material"
        detail_level: moderate
      - name: art_as_substrate
        description: "Does their work function as substrate/ground layer? Could it be embedded in a generative composition?"
        detail_level: moderate
      - name: relational_composition
        description: "Does their practice involve relational/graph-based composition — art determined by connections between elements?"
        detail_level: moderate
      - name: self_recomposing
        description: "Does their work change/evolve/recompose based on inputs, data, or relational changes?"
        detail_level: moderate

  key_works:
    description: "2-3 works most relevant to the research"
    fields:
      - name: works
        description: "List of works with title, year, brief description, and why relevant"
        detail_level: detailed

  protocol_art_resonance:
    description: "Connection to art-as-protocol-design — building systems, infrastructure, governance as creative practice"
    fields:
      - name: protocol_art_summary
        description: "How does this practice treat systems/infrastructure/governance as artistic medium? (empty if not applicable)"
        detail_level: moderate
      - name: system_designed
        description: "What system, protocol, or infrastructure has this practice produced?"
        detail_level: moderate

  commons_orientation:
    description: "Relationship to open/commons models vs proprietary/enclosed"
    fields:
      - name: licence_model
        description: "Open source, CC, commons-based, proprietary, hybrid, or unknown"
        detail_level: brief
      - name: commons_summary
        description: "How they relate to enclosure/openness — do they build commons infrastructure?"
        detail_level: moderate

  governance_model:
    description: "How decisions about the work/practice are made"
    fields:
      - name: governance_type
        description: "solo | collective | DAO | institutional | algorithmic | audience-participatory | hybrid"
        detail_level: brief
      - name: governance_detail
        description: "Specifics of decision-making structure — who decides what, how disputes are handled"
        detail_level: moderate

  consent_and_authorship:
    description: "How they handle consent, authorship, and creative identity"
    fields:
      - name: consent_approach
        description: "How contributor/participant consent is handled"
        detail_level: moderate
      - name: authorship_model
        description: "Solo, collaborative, collective, machine co-authorship, open/distributed?"
        detail_level: moderate

  liveness_and_duration:
    description: "How the work behaves over time"
    fields:
      - name: temporal_type
        description: "static | generative-on-demand | continuously-evolving | responsive-to-input | durational-finite | durational-infinite"
        detail_level: brief
      - name: temporal_detail
        description: "How exactly does the work change, and what drives the change?"
        detail_level: moderate

  data_materiality:
    description: "What data or datasets serve as primary material and their provenance"
    fields:
      - name: data_sources
        description: "What feeds the work — voice, ecological data, museum collections, web scrapes, hand-labeled, etc."
        detail_level: moderate
      - name: data_provenance
        description: "Ethical status of data — consented, scraped, self-generated, institutional, public domain?"
        detail_level: moderate

  embedding_space_relevance:
    description: "Engagement with latent/semantic spaces, multimodal data, or embedding navigation"
    fields:
      - name: embedding_summary
        description: "Does the work engage with semantic/latent/embedding spaces? How?"
        detail_level: moderate
      - name: multimodal
        description: "Does the work span modalities (text, image, audio, video) in a unified space?"
        detail_level: brief

  exhibition_modality:
    description: "How work manifests in physical/digital space"
    fields:
      - name: modality
        description: "installation | screen | spatial-audio | performative | web | hybrid | ambient | architectural"
        detail_level: brief
      - name: spatial_description
        description: "How the work occupies and activates physical or digital space"
        detail_level: moderate

  sensory_register:
    description: "Which senses the practice engages"
    fields:
      - name: senses
        description: "visual | sonic | haptic | olfactory | proprioceptive | textual — list all that apply"
        detail_level: brief
      - name: dominant_register
        description: "Which sensory register is primary?"
        detail_level: brief

  interoperability:
    description: "Can this work connect to or compose with other works?"
    fields:
      - name: composability
        description: "Does the work expose APIs, use standard formats, or produce outputs that serve as inputs elsewhere?"
        detail_level: moderate
      - name: technical_openness
        description: "Open source, documented, forkable, or closed system?"
        detail_level: brief

  technical_approach:
    description: "Tools, platforms, systems used"
    fields:
      - name: stack
        description: "Key technologies — Processing, ML frameworks, blockchain, custom, etc."
        detail_level: moderate

  network_position:
    description: "Structural role in the digital arts field topology"
    fields:
      - name: position_type
        description: "bridge | hub | peripheral | emerging | isolated — where do they sit in the field?"
        detail_level: brief
      - name: scene_affiliation
        description: "Which scenes, communities, or networks they belong to or bridge"
        detail_level: moderate
      - name: connections
        description: "Key relationships to other items in this research (by name)"
        detail_level: moderate

  potential_role_in_adai:
    description: "How this item could relate to A(DAI) specifically"
    fields:
      - name: role
        description: "early-contributor | conversation-partner | artwork-in-graph | advisory | critical-friend | infrastructure-partner | theoretical-reference"
        detail_level: brief
      - name: role_detail
        description: "Specific value to A(DAI) — what would this practitioner/platform bring?"
        detail_level: moderate

  temporal_status:
    description: "Is this active, historical, or somewhere between?"
    fields:
      - name: status
        description: "historical-precedent | completed-project | ongoing-practice | active-infrastructure | emerging"
        detail_level: brief

uncertain: []
