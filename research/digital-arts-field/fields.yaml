# Field definitions for Digital Arts Field Research
# Merged from: model knowledge framework + A(DAI) Combined Design Brief v3.0

# ── Basic Identification ───────────────────────────────────────
basic_identification:
  name:
    description: "Item name"
    detail_level: brief
  type:
    description: "Category: market_platform | practice | movement | institution | tool | framework | discourse | gap | infrastructure"
    detail_level: brief
  originator:
    description: "Key people, organizations, or communities behind this item"
    detail_level: brief
  year:
    description: "Year founded, launched, or emerged"
    detail_level: brief
  key_url:
    description: "Primary web presence or reference"
    detail_level: brief
  geography:
    description: "Where it operates, originates, or is concentrated"
    detail_level: brief

# ── Core Ideas & Positioning ──────────────────────────────────
core_ideas:
  core_claim:
    description: "The central proposition or value claim this item makes"
    detail_level: moderate
  medium_specificity:
    description: "What makes this digitally native? What is specific to digital art about this item vs. art generally?"
    detail_level: moderate
  relation_to_attention_economy:
    description: "How does this item relate to attention logic? Does it optimize for engagement, resist it, or ignore it?"
    detail_level: detailed
  relation_to_intention:
    description: "Does this serve declared structural needs (intention) or capture engagement (attention)? Or is it infrastructure-neutral?"
    detail_level: detailed

# ── Market & Economic Dimensions ──────────────────────────────
market_economics:
  revenue_model:
    description: "How it sustains itself financially. Primary sale, secondary royalties, subscription, grants, token, none."
    detail_level: moderate
  market_position:
    description: "Primary market, secondary market, infrastructure, tool, none. Where in the value chain."
    detail_level: brief
  price_range:
    description: "Typical price points for art sold/exhibited, if applicable"
    detail_level: brief
  volume_trend_2024_2026:
    description: "Growth, decline, stable, or dead. Post-crash trajectory."
    detail_level: moderate
  collector_demographics:
    description: "Who participates as buyer/collector/patron. Crypto-native, traditional, institutional, mixed."
    detail_level: moderate
  sustainability:
    description: "Can this survive without speculative interest? What is the non-hype sustainability model?"
    detail_level: detailed

# ── Practice & Aesthetic Dimensions ───────────────────────────
practice_aesthetics:
  toolchain:
    description: "Primary tools, languages, platforms used. What software/hardware enables this practice?"
    detail_level: moderate
  relation_to_AI:
    description: "How it engages with (or resists) generative AI. Tool, medium, subject, threat, irrelevant."
    detail_level: detailed
  liveness:
    description: "Static artifact, real-time, performative, evolving, generative, interactive."
    detail_level: brief
  aesthetic_vocabulary:
    description: "What critical/aesthetic language exists for describing this? Is the vocabulary adequate or still forming?"
    detail_level: detailed
  tendency_axis_position:
    description: "Position on A(DAI) tendency axes: openness↔enclosure, commons↔capture, spectacle↔infrastructure, individual↔collective"
    detail_level: detailed

# ── Infrastructure & Governance ───────────────────────────────
infrastructure_governance:
  openness:
    description: "Open-source, proprietary, hybrid, CC-licensed. What is shared and what is enclosed?"
    detail_level: moderate
  governance_model:
    description: "Who decides what. DAO, curatorial, corporate, community, founding-team, expert-committee, none."
    detail_level: moderate
  data_sovereignty:
    description: "Who owns/controls the data, art, metadata? Can artists export their data? Is it portable?"
    detail_level: detailed
  interoperability:
    description: "Can it connect to other systems/platforms? Standards compliance. API availability. Graph-readiness."
    detail_level: moderate
  preservation_strategy:
    description: "How permanence is addressed. On-chain, IPFS, institutional archive, none, at-risk."
    detail_level: moderate
  consent_architecture:
    description: "How consent is managed. Binary include/exclude, granular, machine-readable, absent."
    detail_level: detailed

# ── Field Position & Gaps ─────────────────────────────────────
field_position:
  relation_to_traditional_art_world:
    description: "Integration, parallel, opposition, absorption, indifference. How does it sit relative to galleries/museums/fairs?"
    detail_level: moderate
  what_it_enables:
    description: "What becomes possible because of this? What can practitioners do that they couldn't before?"
    detail_level: moderate
  what_it_lacks:
    description: "What's missing, broken, or structurally absent from this item?"
    detail_level: detailed
  who_is_excluded:
    description: "Who can't participate and why? Technical barriers, geographic barriers, economic barriers, cultural barriers."
    detail_level: detailed
  frontier_signal:
    description: "Is this emerging (frontier), established, or declining? If frontier: what category does it challenge?"
    detail_level: moderate

# ── Attention & Intention Dynamics ────────────────────────────
# (From A(DAI) Combined Brief — the core analytical lens)
attention_intention:
  discovery_mechanism:
    description: "How people find this. Algorithm, curation, word of mouth, institutional, search, social media, none."
    detail_level: moderate
  attention_dependency:
    description: "How dependent on platform attention/engagement metrics? Would it survive if Twitter/Instagram disappeared?"
    detail_level: detailed
  intention_alignment:
    description: "Does it serve declared structural needs of the field or capture engagement? Intention-native, attention-native, neutral."
    detail_level: detailed
  commons_contribution:
    description: "Does it contribute to shared field knowledge (open data, shared vocabulary, public infrastructure) or enclose it?"
    detail_level: detailed

# ── Provenance & Temporality ─────────────────────────────────
# (From A(DAI) Combined Brief — provenance of meaning, bi-temporal model)
provenance_temporality:
  provenance_type:
    description: "What kind of provenance does this track? Ownership only, meaning, both, neither."
    detail_level: moderate
  temporal_logic:
    description: "Real-time, archival, cyclical/tidal, anticipatory, deep-historical, none."
    detail_level: moderate
  absence_handling:
    description: "Does this item detect, represent, or address what is missing from the field? Or only what is present?"
    detail_level: detailed

# ── Coherence & Contestability ───────────────────────────────
# (From A(DAI) Combined Brief — coherence without consensus)
coherence:
  coherence_vs_consensus:
    description: "Does this seek consensus (single truth), coherence (multiple valid readings coexist), or neither?"
    detail_level: detailed
  contestability:
    description: "Can outputs, classifications, or judgments be challenged? By whom? Through what mechanism?"
    detail_level: detailed
  forkability:
    description: "Can this be forked — taken, modified, and run independently? What are the practical barriers?"
    detail_level: moderate

# ── A(DAI) Comparison ────────────────────────────────────────
# (Direct comparison fields — what to adopt, what to refuse)
adai_comparison:
  layer_mapping:
    description: "Which A(DAI) layer does this map to? substrate | sensing-loop | prompt-generation | participation | none"
    detail_level: brief
  what_adai_should_adopt:
    description: "Specific patterns, methods, or principles A(DAI) should learn from this item."
    detail_level: detailed
  what_adai_should_refuse:
    description: "What A(DAI) must explicitly refuse from this item's approach."
    detail_level: detailed
  structural_tension:
    description: "The productive tension between this item's approach and A(DAI)'s architecture."
    detail_level: detailed

# ── Regulatory & Legal Environment ────────────────────────────
# (From web search — EU AI Act, consent law, copyright)
regulatory_legal:
  regulatory_exposure:
    description: "Which regulations apply? EU AI Act, AB 2013, DMCA, copyright opt-out regimes. How does this item comply or conflict?"
    detail_level: detailed
  ip_model:
    description: "How intellectual property is handled. CC license, all-rights-reserved, on-chain ownership, public domain, mixed."
    detail_level: moderate
  opt_in_vs_opt_out:
    description: "Is consent opt-in (explicit) or opt-out (must actively refuse)? Neither? What are the implications?"
    detail_level: moderate

# ── Ecosystem Position ────────────────────────────────────────
# (From web search — network effects, dependencies, interrelations)
ecosystem:
  platform_dependency:
    description: "What platforms, chains, or services does this depend on? Single point of failure risk."
    detail_level: moderate
  network_effects:
    description: "Does this benefit from or contribute to network effects? Is it a hub, bridge, or isolate?"
    detail_level: moderate
  post_crash_trajectory:
    description: "Specific trajectory since 2022-2023 crash. Growing, stable, declining, pivoting, dead."
    detail_level: detailed

# ── Uncertain fields (auto-filled during deep research) ──────
uncertain:
  - "collector_demographics (hard to verify for many items)"
  - "volume_trend_2024_2026 (requires market data access)"
  - "price_range (volatile, platform-specific)"
  - "who_is_excluded (requires community research, not just desk research)"
  - "sustainability (speculative for emerging items)"
  - "regulatory_exposure (evolving rapidly, may change by deep research completion)"
