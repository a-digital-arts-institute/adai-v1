topic: "Digital Arts Field — Market, Practices, Infrastructure, Gaps"
date: "2026-03-24"
anchor: "A(DAI) Combined Design Brief v3.0"
comparative_dimensions:
  - "What infrastructure does this item provide or depend on?"
  - "Does it serve attention logic (engagement, novelty, ranking) or intention logic (structural diagnosis, gap detection)?"
  - "Does it contribute to a shared field vocabulary or enclose its knowledge?"
  - "What is missing — what gap does this item reveal or fail to address?"
  - "Who is excluded from participation and why?"
  - "What is its relationship to provenance — of ownership, of meaning, or both?"
  - "Is it surviving the post-NFT-crash recalibration or declining?"

items:

  # ── Market & Economic Infrastructure ──────────────────────────
  - name: "Art Blocks"
    category: "Market & Economic Infrastructure"
    brief: "Pioneered on-chain long-form generative art. Curated + open tiers. Survived 2022-2023 crash."
    relevance: "Proved practitioner-led market infrastructure can outlast speculation. Tests whether curation and on-chain provenance persist without hype."

  - name: "fxhash"
    category: "Market & Economic Infrastructure"
    brief: "Open generative art platform on Tezos. Lower barriers. Community-governed."
    relevance: "Commons-adjacent market infrastructure. Tests open-access vs. curation quality tradeoffs."

  - name: "Foundation"
    category: "Market & Economic Infrastructure"
    brief: "NFT marketplace that shaped digital art primary market dynamics. Invite-only origins."
    relevance: "Defined early social dynamics of digital art market. Tests whether social curation survives without scarcity mechanics."

  - name: "SuperRare"
    category: "Market & Economic Infrastructure"
    brief: "Curated NFT marketplace with DAO governance layer and $RARE token."
    relevance: "Tests DAO governance in art market context. Tension between token-holder governance and curatorial judgment."

  - name: "Zora"
    category: "Market & Economic Infrastructure"
    brief: "Protocol-level marketplace. On-chain media infrastructure. Permissionless."
    relevance: "Infrastructure rather than curation. Tests protocol-level vs. platform-level approaches to art markets."

  - name: "Transient Labs"
    category: "Market & Economic Infrastructure"
    brief: "Creator-first smart contract tools. Custom royalty enforcement, edition mechanics."
    relevance: "Artist tools layer. Tests whether creator-controlled contract infrastructure shifts power dynamics."

  - name: "Prohibition"
    category: "Market & Economic Infrastructure"
    brief: "Curated generative art platform launched 2024. Selective artist onboarding."
    relevance: "Post-crash curation model. Tests whether quality-first positioning sustains in a smaller market."

  - name: "Bright Moments"
    category: "Market & Economic Infrastructure"
    brief: "IRL+digital art experiences. City-based minting events. Community-driven."
    relevance: "Physical-digital hybrid model. Tests whether in-person ritual sustains digital art communities."

  - name: "Christie's / Sotheby's digital art divisions"
    category: "Market & Economic Infrastructure"
    brief: "Legacy auction houses' entry into digital art market. Beeple sale as inflection point."
    relevance: "Institutional legitimacy vector. Tests whether traditional art market infrastructure absorbs or transforms digital art."

  - name: "Art Basel digital programming"
    category: "Market & Economic Infrastructure"
    brief: "Institutional fair engagement with digital art. Online Viewing Rooms. Digital art sectors."
    relevance: "Field-level institutional recognition. Tests whether fair infrastructure evolves to support digital-native work."

  - name: "Manifold"
    category: "Market & Economic Infrastructure"
    brief: "Creator contract platform. Artists deploy their own smart contracts, retain full ownership."
    relevance: "Decentralized creator infrastructure. Tests artist-as-sovereign-publisher model."

  - name: "Artsy / Art Genome Project"
    category: "Market & Economic Infrastructure"
    brief: "Art discovery platform with 1,300+ genome attributes. Proprietary taxonomy."
    relevance: "The most extensive digital art taxonomy — but enclosed. Tests whether proprietary knowledge graphs serve the field."

  - name: "Are.na"
    category: "Market & Economic Infrastructure"
    brief: "Collaborative knowledge curation platform. Anti-algorithmic. Used heavily by digital art practitioners."
    relevance: "Closest to commons knowledge infrastructure but without structured relations. Tests social curation without graph structure."

  - name: "Dataland (Refik Anadol, Spring 2026)"
    category: "Market & Economic Infrastructure"
    brief: "World's first museum dedicated to AI arts, opening Spring 2026 in LA. Frank Gehry development."
    relevance: "Institutional capture or institutional creation? Tests whether artist-founded institutions serve the field differently."

  # ── Artistic Practices & Movements ───────────────────────────
  - name: "Long-form generative art"
    category: "Artistic Practices & Movements"
    brief: "Algorithm-as-artwork. On-chain outputs where the code is the work and each mint is unique."
    relevance: "Defines medium specificity for digital art. Tests whether code-as-art has durable aesthetic and critical vocabulary."

  - name: "AI-native art practices"
    category: "Artistic Practices & Movements"
    brief: "Artists using generative AI as primary medium — Refik Anadol, Sofia Crespo, Jake Elwes, etc."
    relevance: "Fastest-growing practice category. Tests authorship, consent, aesthetic originality under AI conditions."

  - name: "Interspecies / ecological digital art"
    category: "Artistic Practices & Movements"
    brief: "Bio-digital hybrids, non-human sensing. Alexandra Daisy Ginsberg, Ian Cheng, etc."
    relevance: "Tests whether digital art can address ecological crisis. Expanding the field beyond human-centered aesthetics."

  - name: "On-chain art / fully on-chain SVG"
    category: "Artistic Practices & Movements"
    brief: "Art stored entirely on blockchain. Autoglyphs, Terraforms, etc. No external dependencies."
    relevance: "Tests permanence and self-sufficiency. The most radical position on digital art preservation."

  - name: "Latent space exploration"
    category: "Artistic Practices & Movements"
    brief: "Artists working within/against model embedding spaces. Prompt engineering as aesthetic practice."
    relevance: "New medium category. Tests whether working inside AI models constitutes a distinct artistic practice."

  - name: "Decentralized autonomous art"
    category: "Artistic Practices & Movements"
    brief: "Art as protocol. DAO-governed creative projects. Collective creation through smart contracts."
    relevance: "Tests collective authorship and governance-as-medium. Frontier of institutional form."

  - name: "Real-time generative performance"
    category: "Artistic Practices & Movements"
    brief: "Live-coded, sensor-driven performance art. Algorave, TouchDesigner performances."
    relevance: "Tests liveness and embodiment in digital art. Where code meets improvisation."

  - name: "Post-internet art 2.0"
    category: "Artistic Practices & Movements"
    brief: "Post-platform, post-AI networked art. Second wave after initial post-internet movement."
    relevance: "Evolving critical framework. Tests whether post-internet critique updates for AI and post-NFT conditions."

  - name: "Physical-digital hybrid installations"
    category: "Artistic Practices & Movements"
    brief: "Immersive digital art in physical space. teamLab, Random International, Studio Drift."
    relevance: "Dominant exhibition format. Tests whether immersive spectacle serves or undermines digital art's critical function."

  - name: "Digital fashion / wearable art"
    category: "Artistic Practices & Movements"
    brief: "Virtual garments, AR fashion, metaverse clothing. DressX, RTFKT, Auroboros."
    relevance: "Cross-industry practice. Tests digital art's expansion beyond traditional art-world boundaries."

  - name: "Human-machine co-creation"
    category: "Artistic Practices & Movements"
    brief: "Artists working in feedback loops with AI systems. Sougwen Chung's DOUG, Memo Akten, etc."
    relevance: "Distinct from AI-as-tool. Tests collaborative agency between human and machine."

  - name: "Data art / data sculpture"
    category: "Artistic Practices & Movements"
    brief: "Art that makes data visible, tangible, navigable. Ryoji Ikeda, Jer Thorp, etc."
    relevance: "Uses data as material. Tests whether data visualization becomes an aesthetic rather than just informational practice."

  - name: "Blockchain-native conceptual art"
    category: "Artistic Practices & Movements"
    brief: "Art whose concept IS the blockchain mechanism. Pak, Rhea Myers, Sarah Friend."
    relevance: "Medium-reflexive practice. Tests whether blockchain enables genuinely new conceptual art forms."

  # ── Institutions & Education ─────────────────────────────────
  - name: "NEW INC (New Museum)"
    category: "Institutions & Education"
    brief: "Art/tech incubator. Cultural entrepreneurship model. NYC-based."
    relevance: "Tests whether museum-adjacent incubation produces sustainable digital art infrastructure."

  - name: "Rhizome / Net Art Anthology"
    category: "Institutions & Education"
    brief: "Digital art preservation and criticism since 1999. ArtBase. Net Art Anthology."
    relevance: "Longest-running digital art criticism infrastructure. Tests durational commitment to field documentation."

  - name: "ZKM (Center for Art and Media Karlsruhe)"
    category: "Institutions & Education"
    brief: "Major institutional home for media art. Exhibition, collection, research."
    relevance: "European institutional model. Tests whether dedicated media art institutions maintain relevance in NFT/AI era."

  - name: "Ars Electronica"
    category: "Institutions & Education"
    brief: "Festival + lab + museum model for art-technology-society. Prix Ars Electronica."
    relevance: "Most established art-tech institution. Tests whether festival model adapts to post-platform conditions."

  - name: "Creative Coding community (Processing, p5.js, openFrameworks)"
    category: "Institutions & Education"
    brief: "Open-source tools that undergird generative art practice. Education-first ethos."
    relevance: "Foundation of the field's toolchain. Tests whether open-source creative tools sustain without market incentives."

  - name: "Feral File"
    category: "Institutions & Education"
    brief: "Curated digital art exhibitions with artist-first economics. Founded by Casey Reas (Bitmark)."
    relevance: "Artist-curator hybrid model. Tests whether exhibition-as-platform serves artists better than marketplace-as-platform."

  - name: "Serpentine Arts Technologies"
    category: "Institutions & Education"
    brief: "Institutional R&D program bridging art and emerging tech. Collaborations with major artists."
    relevance: "Blue-chip institutional engagement. Tests whether major galleries produce meaningful tech-art R&D."

  - name: "Gray Area (San Francisco)"
    category: "Institutions & Education"
    brief: "Art+tech cultural incubator and education. Exhibitions, residencies, courses."
    relevance: "Regional scene infrastructure. Tests city-specific art-tech ecosystem models."

  - name: "School for Poetic Computation (SFPC)"
    category: "Institutions & Education"
    brief: "Alternative pedagogy for creative technology. Artist-run school in NYC."
    relevance: "Counter-institutional education model. Tests whether artist-run schools shape field vocabulary differently."

  - name: "Right Click Save"
    category: "Institutions & Education"
    brief: "Digital art criticism publication. Long-form writing on digital art, NFTs, generative art."
    relevance: "Dedicated criticism infrastructure. Tests whether specialist publications sustain the field's critical discourse."

  - name: "The Verge / Outland / Flash Art digital coverage"
    category: "Institutions & Education"
    brief: "Mainstream and art-world publications covering digital art. Variable depth and commitment."
    relevance: "Field visibility through external press. Tests whether mainstream coverage serves or distorts the field."

  - name: "transmediale"
    category: "Institutions & Education"
    brief: "Berlin-based festival for art and digital culture. Critical theory orientation."
    relevance: "European critical discourse infrastructure. Tests whether theory-led festivals maintain relevance."

  # ── Infrastructure & Tools ───────────────────────────────────
  - name: "IPFS / Arweave"
    category: "Infrastructure & Tools"
    brief: "Decentralized storage for digital art permanence. Content-addressed vs. permanent storage."
    relevance: "Preservation infrastructure. Tests whether decentralized storage achieves durability for cultural assets."

  - name: "Metadata standards (ERC-721, ERC-1155)"
    category: "Infrastructure & Tools"
    brief: "Token standards defining how digital art ownership is recorded on-chain."
    relevance: "Provenance of ownership layer. Tests whether token standards evolve to carry richer metadata."

  - name: "Provenance tracking systems"
    category: "Infrastructure & Tools"
    brief: "On-chain and off-chain provenance. Verisart, Artory, blockchain-native records."
    relevance: "Tests whether provenance of ownership translates to provenance of meaning."

  - name: "Creative coding frameworks"
    category: "Infrastructure & Tools"
    brief: "Processing, p5.js, TouchDesigner, openFrameworks, Hydra, Sonic Pi."
    relevance: "The field's toolchain. Tests which tools shape aesthetic vocabulary and who can access them."

  - name: "AI model ecosystems for artists"
    category: "Infrastructure & Tools"
    brief: "Stable Diffusion, ComfyUI, RunwayML, Midjourney, custom LoRAs, open-source models."
    relevance: "Fastest-evolving tool layer. Tests access, consent, aesthetic homogenization risks."

  - name: "Digital art conservation"
    category: "Infrastructure & Tools"
    brief: "Preserving born-digital works. Variable media, emulation, migration strategies."
    relevance: "The field's archival crisis. Tests whether conservation practices keep pace with medium evolution."

  - name: "Spawning AI / Have I Been Trained"
    category: "Infrastructure & Tools"
    brief: "Consent infrastructure for AI training data. Artist-built tools for data sovereignty."
    relevance: "Artist-built infrastructure precedent. Tests whether consent tools achieve adoption at scale."

  - name: "Wallets / ENS / on-chain identity"
    category: "Infrastructure & Tools"
    brief: "Crypto wallets as artist identity. ENS domains. On-chain reputation."
    relevance: "Cross-platform identity layer. Tests whether wallet-based identity serves or fragments artist presence."

  - name: "Graph databases / knowledge tools for art"
    category: "Infrastructure & Tools"
    brief: "Neo4j, Wikidata art entries, Getty ULAN/AAT. Structured knowledge about the field."
    relevance: "The infrastructure A(DAI) is building. Tests what structured knowledge exists vs. what's missing."

  # ── Criticism, Theory & Discourse ────────────────────────────
  - name: "Right-click-save discourse"
    category: "Criticism, Theory & Discourse"
    brief: "Debates about digital scarcity, ownership, and value in the NFT era."
    relevance: "Tests whether the field has moved beyond ownership debates to meaning debates."

  - name: "AI authorship debates"
    category: "Criticism, Theory & Discourse"
    brief: "Who is the author when AI generates the work? Copyright, attribution, creative agency."
    relevance: "Unresolved field tension. Tests whether legal/ethical frameworks keep pace with practice."

  - name: "Post-NFT-crash market recalibration (2023-2026)"
    category: "Criticism, Theory & Discourse"
    brief: "How the field adapted after the speculative bubble burst. What survived, what didn't."
    relevance: "The field's current structural condition. Tests which infrastructure was real vs. speculative."

  - name: "Wash trading / market manipulation in digital art"
    category: "Criticism, Theory & Discourse"
    brief: "Structural integrity problems in on-chain markets. Volume inflation, self-dealing."
    relevance: "Trust infrastructure failure. Tests whether on-chain transparency prevents or reveals manipulation."

  - name: "Environmental critique of blockchain art"
    category: "Criticism, Theory & Discourse"
    brief: "Energy use debates. Shift from PoW to PoS. Ongoing materiality questions."
    relevance: "Materiality accounting. Tests whether the field addresses its own infrastructure costs."

  - name: "Digital art and institutional legitimacy"
    category: "Criticism, Theory & Discourse"
    brief: "Museum acquisition strategies. MoMA, Tate, Centre Pompidou, LACMA digital art programs."
    relevance: "Tests whether institutional recognition changes what gets made and who gets seen."

  - name: "Attention economy critique in digital art"
    category: "Criticism, Theory & Discourse"
    brief: "Platform dependency, algorithmic visibility, engagement metrics shaping practice."
    relevance: "Core A(DAI) concern. Tests whether artists recognize and resist attention capture."

  - name: "Commons vs. enclosure in digital art"
    category: "Criticism, Theory & Discourse"
    brief: "Open-source vs. proprietary, CC licenses vs. exclusive rights, shared tools vs. walled gardens."
    relevance: "The field's structural tension. Tests which direction the field moves post-crash."

  # ── Emerging Gaps & Missing Infrastructure ───────────────────
  - name: "No shared knowledge graph for the field"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Unlike traditional art (Getty ULAN/AAT), digital art has no structured, shared vocabulary or relational map."
    relevance: "The gap A(DAI) exists to fill. The field cannot name itself."

  - name: "Discoverability crisis"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Artists outside platform algorithms are invisible. No field-wide discovery mechanism beyond social media."
    relevance: "Attention economy failure. Tests whether alternative discovery infrastructure is possible."

  - name: "Cross-platform identity fragmentation"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Artists fragmented across platforms (Twitter/X, Instagram, Foundation, Art Blocks, Feral File) with no unified presence."
    relevance: "Infrastructure gap. No single place to see a practitioner's full relational context."

  - name: "Valuation infrastructure gap"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "No transparent pricing/valuation models adapted for digital art. Floor price ≠ value."
    relevance: "Market infrastructure failure. Tests whether valuation can move beyond speculative metrics."

  - name: "Residency/grant infrastructure for digital artists"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Funding mechanisms lag behind practice. Few residencies designed for code-based or AI-based work."
    relevance: "Sustainability gap. Tests whether the field can fund practitioners outside market cycles."

  - name: "Archival gap for born-digital works"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "No field-wide preservation strategy. Works depend on platforms, chains, and formats that may not persist."
    relevance: "Deep-time infrastructure failure. The field is producing work faster than it can preserve."

  - name: "Criticism infrastructure deficit"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Few sustained critical publications. Most coverage is promotional or market-oriented."
    relevance: "The field lacks independent critical vocabulary. No equivalent of Artforum for digital art."

  - name: "Scene documentation gap"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Local/regional digital art scenes are undocumented and invisible to the broader field."
    relevance: "Geographic blindness. Tests whether the field can see beyond North American/European centres."

  - name: "Provenance of meaning (vs. ownership)"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "On-chain provenance tracks who owned what. Nothing tracks the intellectual, critical, or relational context of a work."
    relevance: "The core A(DAI) thesis. Ownership provenance exists; meaning provenance does not."

  - name: "Collective intelligence infrastructure"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "No mechanism for the field to synthesize what it collectively knows. Individual knowledge stays individual."
    relevance: "The deepest gap. Practitioners have field knowledge that is never aggregated or structured."

  # ── Web Search Supplements (March 2026) ──────────────────────

  # Market & Economic Infrastructure — supplements
  - name: "Zero 10 (Art Basel)"
    category: "Market & Economic Infrastructure"
    brief: "Art Basel's curated platform for digital-era art. Launched Miami Beach Dec 2025, supported by OpenSea. Named after Malevich 1915."
    relevance: "Most significant institutional market signal since Beeple sale. Formalizes digital art's place in premier fair system."

  - name: "Highlight"
    category: "Market & Economic Infrastructure"
    brief: "Generative art platform on Ethereum L2. Zero creator fees — artists keep 100% of primary sale."
    relevance: "Tests mass-access generative art market. Fills gap between Art Blocks curation and fxhash openness."

  - name: "Verse"
    category: "Market & Economic Infrastructure"
    brief: "UK-based NFT art platform curated by art world experts. Hosted Botto's 2025 London exhibition."
    relevance: "Gallery-quality curation model applied to digital-native sales."

  - name: "Objkt"
    category: "Market & Economic Infrastructure"
    brief: "Leading Tezos marketplace. Generative art, residencies, Digital Art Mile in Basel, #OpenTez events."
    relevance: "Most active non-Ethereum marketplace ecosystem. Scene infrastructure for Tezos-based art."

  - name: "Kirke"
    category: "Market & Economic Infrastructure"
    brief: "Commission-based platform, 0% fees, invite-only, secure escrow, explicitly non-AI. Launched April 2025."
    relevance: "Counter-movement emphasizing human-made original work. Tests anti-AI market positioning."

  - name: "OpenSea pivot to all-in-one crypto platform"
    category: "Market & Economic Infrastructure"
    brief: "Transitioning from NFT marketplace to full crypto trading platform with token swaps and cross-chain support."
    relevance: "Structural shift in marketplace economics post-crash. Tests whether art-specific marketplaces survive."

  - name: "fxhash $FXH token and bonding curves"
    category: "Market & Economic Infrastructure"
    brief: "Art coins via bonding curves on Base L2. Multiple revenue streams beyond royalties for artists."
    relevance: "New economic model for artist compensation. Tests tokenized artist-collector relationships."

  # Artistic Practices — supplements
  - name: "Botto (Decentralized Autonomous Artist)"
    category: "Artistic Practices & Movements"
    brief: "AI-human hybrid entity governed by DAO. Creates thousands of fragments weekly, community votes select canonical works."
    relevance: "Most developed example of art-as-protocol. Tests autonomous machine creativity with community governance."

  - name: "AI agent art / iNFTs (ERC-7857, ERC-8004)"
    category: "Artistic Practices & Movements"
    brief: "NFTs that evolve, link AI models, or serve as identity for AI agents. ~30% of 2025 NFT projects incorporated AI."
    relevance: "Leading conceptual frontier. Moves beyond 'AI as tool' to 'AI as autonomous creative entity.'"

  - name: "Runtime art / NFTs-as-software"
    category: "Artistic Practices & Movements"
    brief: "NFTs that function as executable software rather than static images. Material Protocol Arts and others."
    relevance: "Tokens as programs, not pictures. 2025's leading conceptual frontier for medium specificity."

  - name: "Robot art / AI embodiment"
    category: "Artistic Practices & Movements"
    brief: "Agnieszka Pilat's Heterobota (Boston Dynamics robots painting at NGV). Sougwen Chung's MEMORY (V&A collection)."
    relevance: "Convergence of robotics, AI, and physical art practice. Tests embodiment in digital art."

  - name: "Large-scale data art / environmental AI models"
    category: "Artistic Practices & Movements"
    brief: "Artist-built AI models trained on domain-specific datasets. Refik Anadol's Large Nature Model (open-source, UN, Guggenheim)."
    relevance: "New category: artist-as-model-builder. Tests whether artist-built AI infrastructure becomes public resource."

  - name: "Co-creative / parametric collecting"
    category: "Artistic Practices & Movements"
    brief: "Collectors write code to shape outputs (fxhash fx(params), up to 512 chars). Piter Pasma's Universal Rayhatcher."
    relevance: "Shifts collector from passive buyer to active co-creator. Tests new artist-collector relationship."

  # Institutions — supplements
  - name: "Canyon (NYC, 2026)"
    category: "Institutions & Education"
    brief: "40,000 sqft museum for video, sound, performance, durational art. Launching CMACC — first US nonprofit conservation center for time-based media."
    relevance: "Directly addresses the archival gap. Opening with Ryoji Ikeda retrospective."

  - name: "Le Random"
    category: "Institutions & Education"
    brief: "Digital art knowledge base and collection platform focused on generative art history and context."
    relevance: "Digital-native institutional model. Tests whether knowledge base + collection sustains field memory."

  - name: "Outland Art"
    category: "Institutions & Education"
    brief: "Digital art publication with criticism initiatives. Brian Droitcour's 'Learning in Public' (Oct 2025)."
    relevance: "Critical discourse infrastructure. Tests whether dedicated digital art publications sustain."

  - name: "Whitney Biennial 2026"
    category: "Institutions & Education"
    brief: "15 of 56 selected artists/collectives work with art and technology. Opened March 2026."
    relevance: "Institutional legitimacy threshold. Tests whether biennial inclusion changes field dynamics."

  - name: "MoMA CryptoPunks acquisition (Dec 2025)"
    category: "Institutions & Education"
    brief: "MoMA acquired eight CryptoPunks. Landmark institutional validation for early NFT art."
    relevance: "Tests whether museum acquisition changes how early NFT art is historicized."

  # Infrastructure — supplements
  - name: "Content Credentials / C2PA"
    category: "Infrastructure & Tools"
    brief: "Adobe-led cryptographic provenance standard. Coalition: Microsoft, Google, Meta, OpenAI, Sony, BBC. NSA/DoD endorsed Jan 2025."
    relevance: "Most significant provenance infrastructure since blockchain. Non-blockchain. Tests whether corporate-backed provenance displaces decentralized approaches."

  - name: "EU AI Act training data provisions (2026)"
    category: "Infrastructure & Tools"
    brief: "Mandatory disclosure of training data sources, copyright opt-out respect, AI content labeling."
    relevance: "Most consequential regulatory development for the field. Design constraint for any knowledge infrastructure."

  - name: "Canyon Media Art Conservation Center (CMACC)"
    category: "Infrastructure & Tools"
    brief: "First US nonprofit conservation center for time-based media art. Part of Canyon museum."
    relevance: "Directly addresses born-digital archival gap."

  - name: "ERC-7857 / ERC-8004 (intelligent NFT standards)"
    category: "Infrastructure & Tools"
    brief: "Token standards for evolving NFTs with AI model links and AI agent identity."
    relevance: "Technical standards for dynamic, agent-based digital art. Extends ERC-721/1155."

  # Criticism — supplements
  - name: "Christie's digital art department closure (Sept 2025)"
    category: "Criticism, Theory & Discourse"
    brief: "Sent shockwaves through NFT/digital art markets. Signals limits of legacy institutional commitment."
    relevance: "Tests whether traditional auction infrastructure was ever structurally committed to digital art."

  - name: "K-shaped digital art market"
    category: "Criticism, Theory & Discourse"
    brief: "Post-crash market split: top tier with cultural weight thrives, lower tier losing ground. PFP collections largely collapsed."
    relevance: "Analytical frame for 2024-2026 dynamics. Tests which infrastructure survives market stratification."

  - name: "CloneX/RTFKT metadata loss incident (April 2025)"
    category: "Criticism, Theory & Discourse"
    brief: "CloneX NFTs lost all art when Cloudflare restricted access. On-chain tokens, centralized metadata."
    relevance: "Critical case study for preservation debate. Tests whether current infrastructure actually preserves art."

  - name: "Digital art as third-place collector spending (Art Basel/UBS 2025)"
    category: "Criticism, Theory & Discourse"
    brief: "51% of HNW collectors purchased digital art. Share in collections jumped 3% to 13%. Third after painting/sculpture."
    relevance: "Legitimacy threshold crossing. Tests whether collector adoption translates to field infrastructure investment."

  # Gaps — supplements
  - name: "Opt-out vs. opt-in consent infrastructure gap"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Opt-out approaches (Spawning) are fundamentally flawed because creators cannot control data on third-party platforms. No opt-in default exists."
    relevance: "Central policy debate affecting digital artists. Current consent infrastructure may be structurally inadequate."

  - name: "Centralized metadata vulnerability"
    category: "Emerging Gaps & Missing Infrastructure"
    brief: "Most NFTs point to centralized metadata/media. CloneX incident proved tokens survive but art disappears."
    relevance: "On-chain ownership provenance is hollow if the artwork itself isn't durable. Infrastructure gap between token and media."

execution:
  batch_size: 8
  items_per_agent: 10
  output_dir: "./results"
