topic: "Garden Logic Comparative Analysis — Ontology, Neural KGs, Media as Training Data, Intention Economy, Attention Critique, Provocations, Pre-Movement Sensing"
description: >
  Comparative analysis of architecture proposals and precedents against A(DAI)'s
  Garden Logic document. Each item is evaluated for alignment, tension, and
  structural contribution to the intention-over-attention paradigm.

comparative_anchor: "The Garden Logic: How A(DAI) Becomes an Institution Through Generative Intention"
comparative_dimensions:
  - Does this item support or challenge the intention-over-attention distinction?
  - Does it offer a technical precedent for any Garden Logic layer (substrate, sensing, prompt, participation)?
  - Does it address coherence-without-consensus or default to consensus?
  - Does it handle absence detection, structural gaps, or blind spots?
  - Does it support forkability, distributed sovereignty, or commons governance?
  - What is its temporal logic — real-time (attention) or tidal/cyclical (intention)?
  - Does it embed its critique in architecture or in rhetoric?

items:
  # --- ONTOLOGY & KNOWLEDGE REPRESENTATION ---
  - id: 1
    name: "CIDOC-CRM"
    type: ontology
    brief: "ISO 21127 standard ontology for cultural heritage. Event-based model. The canonical fixed-taxonomy approach."
    garden_logic_relevance: "Counter-model — cathedral ontology vs. A(DAI)'s emergent/extensible vocabulary. Tests whether fixed ontologies can accommodate frontier signals."

  - id: 2
    name: "Wikidata / Wikibase"
    type: ontology
    brief: "Open knowledge graph with community-governed ontology evolution. Multilingual. 100M+ items."
    garden_logic_relevance: "Closest precedent for commons-governed category extension (Mode B3). Tests whether community vocabulary governance scales without consensus collapse."

  - id: 3
    name: "Schema.org"
    type: ontology
    brief: "Lightweight consensus-driven web vocabulary. Extended without breaking via extension mechanism."
    garden_logic_relevance: "Model for vocabulary extension that preserves backward compatibility. Relevant to edge type and node type proposals in /extend."

  - id: 4
    name: "Getty ULAN / AAT / TGN"
    type: ontology
    brief: "Art-specific controlled vocabularies. Expert-curated. High authority, low adaptability."
    garden_logic_relevance: "Represents the institutional voice A(DAI) critiques — authoritative but not contestable. No fork rights, no frontier signals."

  - id: 5
    name: "SKOS (Simple Knowledge Organization System)"
    type: ontology
    brief: "W3C standard for concept schemes with loose coupling between terms. Supports broader/narrower/related."
    garden_logic_relevance: "Lightweight enough for A(DAI)'s typed edges. Could model tendency axes as concept schemes."

  - id: 6
    name: "OntoGPT / LLM-driven ontology learning"
    type: ontology
    brief: "Using LLMs to extract and propose ontological structures from unstructured text. Bottom-up category discovery."
    garden_logic_relevance: "Direct precedent for absence detection — finding concepts the graph implicitly contains but hasn't formalized. Automates what Mode B3 does manually."

  - id: 7
    name: "Emergent ontology / taxonomy induction"
    type: ontology
    brief: "Unsupervised discovery of categories from data. REBEL, DeepOnto, ontology alignment research."
    garden_logic_relevance: "The garden's sensing layer needs to detect categories that don't exist yet. This is the technical literature for that capability."

  # --- NEURAL KNOWLEDGE GRAPHS ---
  - id: 8
    name: "GraphRAG (Microsoft, 2024)"
    type: neural-kg
    brief: "LLM-augmented KG construction. Community detection + hierarchical summarization. Query-focused."
    garden_logic_relevance: "Direct technical precedent for the sensing loop. Community detection maps to cluster analysis in the survey cycle. But GraphRAG optimizes for query answering (attention), not structural diagnosis (intention)."

  - id: 9
    name: "LightRAG (EMNLP 2025)"
    type: neural-kg
    brief: "Dual-level retrieval — entity-level (low) and thematic (high). Graph-structured text indexing."
    garden_logic_relevance: "The dual-level model maps to A(DAI)'s pulse (low-level metrics) and dream (high-level narrative). But LightRAG is retrieval-optimized, not diagnosis-optimized."

  - id: 10
    name: "NodeRAG (2025)"
    type: neural-kg
    brief: "Heterogeneous graph with 7 node types for richer retrieval. Outperforms GraphRAG on multi-hop reasoning."
    garden_logic_relevance: "A(DAI) has 17 node types. NodeRAG's heterogeneous graph architecture validates the design. The multi-hop reasoning is relevant to coherence prompts that trace connections across clusters."

  - id: 11
    name: "Knowledge Graph Embeddings (TransE, RotatE, ComplEx)"
    type: neural-kg
    brief: "Vector representations of graph structure. Enable link prediction, gap detection, similarity computation."
    garden_logic_relevance: "Link prediction = structural absence detection. Could automate coherence prompts: 'these clusters should be connected based on embedding proximity but aren't.'"

  - id: 12
    name: "Think-on-Graph / KAPING / KG-augmented LLM reasoning"
    type: neural-kg
    brief: "Systems that give LLMs graph-walking capabilities. Reasoning chains follow edges."
    garden_logic_relevance: "The Ralph pattern (one Claude call per prompt, graph context injected) is a simpler version of this. These systems show what happens when the LLM can traverse the graph during reasoning."

  - id: 13
    name: "Neo4j + Vector Search / hybrid graph-vector stores"
    type: neural-kg
    brief: "Graph databases with native embedding support. Combines symbolic structure with neural similarity."
    garden_logic_relevance: "Infrastructure option for the substrate layer. The CR-SQLite choice prioritizes forkability over query power. Neo4j prioritizes query power over forkability. This is the core tension."

  - id: 14
    name: "Multimodal Knowledge Graphs"
    type: neural-kg
    brief: "KGs that incorporate images, audio, video as node properties alongside text. MMKG, VisualSem."
    garden_logic_relevance: "A(DAI) indexes artworks as nodes. The substrate stores multimodal embeddings (Design Brief section 06). This literature covers the technical challenges."

  # --- MEDIA AS TRAINING DATA ---
  - id: 15
    name: "Spawning AI / Have I Been Trained / Source.Plus"
    type: media-data
    brief: "Consent infrastructure. Do Not Train registry. Source.Plus ethical dataset platform (2024). datadiligence library."
    garden_logic_relevance: "A graph node AND an architectural precedent. Spawning embodies the consent-infrastructure cluster. Source.Plus is what A(DAI)'s intake pipeline could learn from re: provenance."

  - id: 16
    name: "The Pile / LAION-5B / Common Crawl debates"
    type: media-data
    brief: "Training dataset controversies. The Pile discontinued. LAION-5B pulled for CSAM. Commons vs. extraction."
    garden_logic_relevance: "The anti-pattern. These datasets treated media as raw material for extraction. A(DAI) treats signals as contributions with provenance. The failure mode A(DAI) must avoid."

  - id: 17
    name: "Data-centric AI movement (Datacomp, DataPerf)"
    type: media-data
    brief: "Shift from model-centric to data-centric ML. Training data curation as primary engineering."
    garden_logic_relevance: "A(DAI)'s signal pipeline IS data-centric. The intake quality determines everything downstream. Data-centric AI validates the architectural choice to invest in signal processing over model sophistication."

  - id: 18
    name: "Indigenous Data Sovereignty (CARE Principles)"
    type: media-data
    brief: "Collective benefit, Authority to control, Responsibility, Ethics. Non-Western data governance."
    garden_logic_relevance: "The deepest challenge to A(DAI)'s commons model. CARE asks: whose commons? Who governs? Fork rights are necessary but not sufficient if the forking population is homogeneous."

  - id: 19
    name: "W3C PROV / Model Cards / Datasheets for Datasets"
    type: media-data
    brief: "Provenance documentation standards. Machine-readable lineage tracking."
    garden_logic_relevance: "Direct architectural alignment. The Garden Logic's provenance chain tracks every fork, merge, narrative, and signal. W3C PROV is the standard this should conform to."

  - id: 20
    name: "AI training data governance 2025-2026 (EU AI Act, California AB 2013, CONSENT Act)"
    type: media-data
    brief: "Regulatory landscape. Training data transparency mandates. Opt-out vs consent debate."
    garden_logic_relevance: "External constraint on the system. If A(DAI) processes signals that contain copyrighted material, it operates within this regulatory regime. The consent-at-the-gate model (Design Brief) is ahead of regulation."

  # --- INTENTION ECONOMY ---
  - id: 21
    name: "Doc Searls — The Intention Economy (2012)"
    type: intention-economy
    brief: "Demand-side economics. Users declare intent rather than being targeted. The inverse of advertising."
    garden_logic_relevance: "The conceptual origin. A(DAI) extends Searls from commerce to cultural intelligence: the commons declares what it intends, the system reads whether the intention is being fulfilled."

  - id: 22
    name: "VRM (Vendor Relationship Management)"
    type: intention-economy
    brief: "Technical infrastructure for intention-driven commerce. Customer-side CRM."
    garden_logic_relevance: "Architectural analogy. VRM inverts CRM. A(DAI) inverts platform analytics. Both replace 'what do they want from us' with 'what do we intend for ourselves.'"

  - id: 23
    name: "Solid Project (Tim Berners-Lee)"
    type: intention-economy
    brief: "Personal data pods. Users control their data. Decouples apps from data."
    garden_logic_relevance: "The fork right as data sovereignty. Solid's pods are personal; A(DAI)'s forks are institutional. Same principle: sovereignty over your own view of the data."

  - id: 24
    name: "Protocol Labs / IPFS / Filecoin"
    type: intention-economy
    brief: "Decentralized storage and addressing. Content-addressed data. Persistence infrastructure."
    garden_logic_relevance: "Infrastructure layer for forkable commons. If the graph is content-addressed (IPFS), forks become lightweight and provenance is mathematical."

  - id: 25
    name: "Ostrom's Commons Governance (Governing the Commons, 1990)"
    type: intention-economy
    brief: "8 design principles for managing shared resources. Polycentric governance. Nobel 2009."
    garden_logic_relevance: "The theoretical backbone. A(DAI)'s merge boundary IS Ostrom's governance boundary. The question is whether 'governance at the gate, not inside the data' satisfies Ostrom's principles."

  - id: 26
    name: "Platform Cooperativism (Scholz, 2014→)"
    type: intention-economy
    brief: "Worker/user-owned platforms. Democratic governance of digital infrastructure."
    garden_logic_relevance: "A(DAI) is not a platform, but the cooperative ownership question applies: who governs the merge boundary? The founding team? The contributors? The forkers?"

  # --- ATTENTION ECONOMY CRITIQUE ---
  - id: 27
    name: "Georg Franck — The Economy of Attention (1998)"
    type: attention-critique
    brief: "Attention as scarce resource and currency. Mental capitalism. The original theoretical formulation."
    garden_logic_relevance: "The theoretical target. A(DAI) is designed as the structural negation of Franck's attention economy."

  - id: 28
    name: "Yves Citton — The Ecology of Attention (2017)"
    type: attention-critique
    brief: "Reframes attention as ecological, not economic. Collective attention as commons. Joint attention as political."
    garden_logic_relevance: "The closest intellectual ally. Citton's 'ecology' maps to A(DAI)'s 'garden.' His joint attention maps to A(DAI)'s collective intention. The key difference: Citton still centers attention; A(DAI) replaces it."

  - id: 29
    name: "Shoshana Zuboff — Surveillance Capitalism (2019)"
    type: attention-critique
    brief: "Attention capture as raw material for behavioral prediction markets. Behavioral surplus extraction."
    garden_logic_relevance: "Zuboff describes the extraction A(DAI) refuses. The 'behavioral surplus' is what A(DAI)'s provenance chain prevents — the system never strips context from signals."

  - id: 30
    name: "Jenny Odell — How to Do Nothing (2019)"
    type: attention-critique
    brief: "Attention refusal as political act. Bioregional attention. 'Third spaces' beyond productivity."
    garden_logic_relevance: "The tidal rhythm (6/24/72h cycles) IS 'doing nothing' at the architectural level. The dream cycle refuses real-time responsiveness. Odell's politics, A(DAI)'s engineering."

  - id: 31
    name: "Jonathan Crary — Scorched Earth (2022)"
    type: attention-critique
    brief: "Attention as the last frontier of enclosure. Links attention capture to ecological crisis."
    garden_logic_relevance: "The urgency claim. If Crary is right that attention enclosure is linked to ecological collapse, then A(DAI)'s intention-economy is not just a design preference — it's an ecological necessity."

  - id: 32
    name: "Tim Wu — The Attention Merchants (2016)"
    type: attention-critique
    brief: "Historical account of attention capture from penny press to social media. The 'attention harvest.'"
    garden_logic_relevance: "Historical context for what A(DAI) refuses. Wu shows that attention capture is not a tech problem — it's a 200-year pattern. A(DAI) needs to be robust against pattern recurrence."

  - id: 33
    name: "James Williams — Stand Out of Our Light (2018)"
    type: attention-critique
    brief: "Ex-Google strategist. Persuasive design undermines autonomy. Three levels of attention."
    garden_logic_relevance: "Williams' three levels (spotlight, starlight, daylight) map to A(DAI)'s CLA layers. Spotlight = surface. Starlight = worldview. Daylight = myth. The sensing loop operates at all three."

  # --- PROVOCATIONS / ARTISTIC PRECEDENTS ---
  - id: 34
    name: "Forensic Architecture"
    type: provocation
    brief: "Investigative aesthetics. Evidence infrastructure as institutional form. Art as spatial and temporal analysis."
    garden_logic_relevance: "Directly referenced as a graph node. The coherence prompt example connects FA to the consent cluster. FA demonstrates that evidence infrastructure IS an artistic practice."

  - id: 35
    name: "Hito Steyerl"
    type: provocation
    brief: "Theory-practice of circulation, poor images, duty-free art. Institutional critique from within technology."
    garden_logic_relevance: "Graph node. Steyerl's 'In Defense of the Poor Image' is the attention-economy critique as artistic practice. Her work on duty-free art zones maps to A(DAI)'s commons-vs-enclosure tendency."

  - id: 36
    name: "Holly Herndon + Mat Dryhurst + Spawning"
    type: provocation
    brief: "Consent-based AI art. Protocol as practice. Artist-led infrastructure."
    garden_logic_relevance: "The practitioner-as-institution-builder case study. Herndon's trajectory from album to protocol is the 'myth prompt' example — the graph documenting artists building infrastructure, not just making work."

  - id: 37
    name: "Sougwen Chung"
    type: provocation
    brief: "Human-machine collaboration. D.O.U.G. series. V&A model acquisition. WEF Spectral performance."
    garden_logic_relevance: "The Garden Logic's primary trajectory analysis case. The open-source → proprietary → elite-adjacent arc is the intention system's diagnostic in action."

  - id: 38
    name: "Jonas Staal — New World Summit"
    type: provocation
    brief: "Art as institutional infrastructure. Parliamentary aesthetics. Assemblies as artwork."
    garden_logic_relevance: "Staal makes institutions AS art. A(DAI) IS an institution-as-artwork. Direct structural parallel: the system's architecture is its critique."

  - id: 39
    name: "Furtherfield"
    type: provocation
    brief: "25+ year commons-first art platform. Art Data Money program. DECAL lab."
    garden_logic_relevance: "The longest-running precedent for commons-first digital art infrastructure. Tests whether commons-first institutions survive at scale. What did they learn in 25 years?"

  - id: 40
    name: "Benjamin Bratton — The Stack"
    type: provocation
    brief: "Planetary-scale computation as accidental megastructure. Six layers of geopolitical infrastructure."
    garden_logic_relevance: "The Stack is the infrastructure A(DAI) operates within. A(DAI) is a deliberate, commons-first structure inside Bratton's accidental, sovereignty-eroding megastructure."

  # --- SENSING MECHANISMS THAT PRECEDE MOVEMENTS ---
  - id: 41
    name: "Causal Layered Analysis (Syed Inayatullah)"
    type: sensing
    brief: "Four layers: litany, system, worldview, myth. Futures methodology for structural analysis."
    garden_logic_relevance: "Directly adopted as the dream cycle's analytical framework. The Garden Logic's six prompt types map to CLA layers. The question: does CLA's static layer model accommodate the temporal dynamics of A(DAI)'s tidal sensing?"

  - id: 42
    name: "Weak Signals (Igor Ansoff, 1975)"
    type: sensing
    brief: "Strategic foresight. Early indicators of emerging change before they become trends. Signal-to-noise discrimination."
    garden_logic_relevance: "Frontier signals ARE weak signals with a 90-day lifecycle. Ansoff's framework distinguishes detection from interpretation. A(DAI) adds a third step: the commons' response to the signal is itself a signal."

  - id: 43
    name: "Three Horizons Framework (Bill Sharpe, 2013)"
    type: sensing
    brief: "H1 (declining dominant), H2 (emerging innovations), H3 (long-term vision). Maps transition dynamics."
    garden_logic_relevance: "The tendency vocabulary (openness↔enclosure, commons↔capture) maps to Three Horizons. H1 = attention economy. H3 = intention economy. H2 = A(DAI) itself. The framework helps the sensing layer read its own position."

  - id: 44
    name: "Cynefin Framework (Dave Snowden)"
    type: sensing
    brief: "Sensemaking for complex adaptive systems. Clear, complicated, complex, chaotic, confused domains."
    garden_logic_relevance: "The graph operates in the complex domain (Cynefin): emergent patterns, no fixed causality, probe-sense-respond. The tidal rhythm IS probe-sense-respond at 6/24/72h intervals."

  - id: 45
    name: "Santa Fe Institute — Complex Adaptive Systems"
    type: sensing
    brief: "Mathematical foundations for emergence in networks. Phase transitions, power laws, fitness landscapes."
    garden_logic_relevance: "The substrate's graph topology exhibits complex-systems properties. Community detection, bridge nodes, structural holes — these are complex-systems analytics applied to cultural intelligence."

  - id: 46
    name: "Dark Matter Labs / Indy Johar"
    type: sensing
    brief: "Civic infrastructure sensing. Systemic design. Institutional innovation for the 21st century."
    garden_logic_relevance: "Closest institutional analogy. Dark Matter also builds infrastructure that reads institutional gaps. Their 'institutional innovation' is A(DAI)'s 'institution of intention.' Different field, same logic."

  - id: 47
    name: "Will Straw — Scene Analysis (1991→)"
    type: sensing
    brief: "How musical/artistic scenes form, coalesce, and dissipate. Structural precursors to 'movements.'"
    garden_logic_relevance: "The /scenes/ directory in the intelligence repo. Straw's scene analysis provides the theoretical grounding for why A(DAI) maps scenes as distinct from practitioners or practices."

  - id: 48
    name: "Anticipatory Governance (David Guston, 2014)"
    type: sensing
    brief: "Foresight + engagement + integration for governing emerging tech before it crystallizes."
    garden_logic_relevance: "The dream cycle IS anticipatory governance applied to culture. The system reads tendencies before they crystallize into movements, and generates prompts before the field has decided what it thinks."

  # --- SUPPLEMENTARY ITEMS (from web search) ---
  - id: 49
    name: "CR-SQLite / Automerge / Local-first Software"
    type: ontology
    brief: "CRDT-based databases enabling forkable, mergeable, offline-first data. Mathematical conflict resolution."
    garden_logic_relevance: "The mechanical foundation for fork rights. CRDTs guarantee that independent observations never conflict — the composite primary key design. Tests whether CRDT semantics match commons governance needs."

  - id: 50
    name: "Transparency Coalition (TCAI) — Do Not Train standard"
    type: media-data
    brief: "Advocacy for machine-readable DNT tags in training data pipelines. Cross-platform consent standard."
    garden_logic_relevance: "The regulatory environment A(DAI)'s intake pipeline must respect. If signals contain copyrighted or DNT-flagged content, the pipeline needs technical compliance."

  - id: 51
    name: "Pierre Bourdieu — Field Theory / Cultural Capital"
    type: sensing
    brief: "The field as a space of positions and position-takings. Cultural capital, symbolic violence, habitus."
    garden_logic_relevance: "The unacknowledged theoretical ancestor. A(DAI)'s graph IS a Bourdieusian field analysis made computational. The tendency vocabulary maps to Bourdieu's axes of capital. The question: does A(DAI) reproduce the field's power structure by mapping it?"

  - id: 52
    name: "Bruno Latour — Actor-Network Theory"
    type: sensing
    brief: "Non-human actants. Networks of associations. 'Follow the actors.' Reassembling the social."
    garden_logic_relevance: "The graph's typed edges between human and non-human nodes (artworks, platforms, protocols) IS ANT. Latour's insistence on tracing associations rather than explaining them maps to A(DAI)'s structural diagnosis."

  # --- WEB SEARCH SUPPLEMENTARY ITEMS ---

  # Neural KG additions
  - id: 53
    name: "Graphiti / Zep (2025)"
    type: neural-kg
    brief: "Temporal KG engine with bi-temporal model (event time vs ingestion time), episodic/semantic/community subgraphs. 300ms retrieval."
    garden_logic_relevance: "The bi-temporal model directly addresses A(DAI)'s tidal sensing. Event time = when a signal happened. Ingestion time = when the commons noticed. The gap between them is an intention metric."

  - id: 54
    name: "AutoSchemaKG (2025)"
    type: neural-kg
    brief: "Dynamic schema discovery for KGs. Auto-extracts and merges entity types via vector clustering + LLM deduplication."
    garden_logic_relevance: "Automates Mode B3 vocabulary extension. Schema emerges from data rather than being designed. The question: does emergent schema satisfy the contestability requirement?"

  - id: 55
    name: "KG Incompleteness as Feature (NSF-KGE, 2024)"
    type: neural-kg
    brief: "Negative-sampling-free KG embeddings that treat incompleteness as structural information, not just missing data."
    garden_logic_relevance: "The deepest technical alignment. A(DAI)'s absence detection treats gaps as diagnostic information. This literature formalizes that principle mathematically."

  # Cultural Heritage KGs
  - id: 56
    name: "CHAD-KG (2025)"
    type: ontology
    brief: "Knowledge graph for cultural heritage built on CIDOC-CRM, LRMoo, CRMdig, Getty AAT. Demonstrates ontology integration."
    garden_logic_relevance: "Shows how existing cultural ontologies can be composed. Tests whether A(DAI) needs its own ontology or can compose from existing standards."

  # Media as Training Data additions
  - id: 57
    name: "Consent in Crisis — AI Data Commons Decline (2024)"
    type: media-data
    brief: "Documents ~5% of major training corpora tokens becoming restricted by robots.txt in under a year. Quantifies commons erosion."
    garden_logic_relevance: "The external threat. The commons A(DAI) operates within is actively shrinking. The system must be designed for a world where open data is contracting, not expanding."

  - id: 58
    name: "IEEE 7012 / MyTerms (Doc Searls, 2025)"
    type: intention-economy
    brief: "Machine-readable personal privacy terms standard. Individuals set terms for data use. Most concrete technical artifact of the intention economy."
    garden_logic_relevance: "The technical layer A(DAI)'s consent architecture could adopt. If contributors set machine-readable terms on their signals, the merge boundary can enforce them automatically."

  # Intention Economy — CRITICAL ADDITION
  - id: 59
    name: "Chaudhary & Penn — 'Beware the Intention Economy' (Harvard Data Science Review, 2024)"
    type: intention-economy
    brief: "Redefines 'intention economy' as LLM-driven commodification of intent through latent persuasion, sycophancy, hyper-personalization. INVERTS Searls' formulation."
    garden_logic_relevance: "THE critical counterpoint. If LLMs can manufacture intention (not just capture attention), then A(DAI)'s claim to generate intention must address the possibility that its own Claude-powered prompts are a form of intention manufacturing. The system must demonstrate that its prompts surface existing structural gaps rather than create new desires."

  - id: 60
    name: "Data Cooperatives as AI Governance (Harvard Ash Center, 2024)"
    type: intention-economy
    brief: "Cooperative ownership models for collective data control. Superset, Cohere Aya as examples. Democratic governance of AI resources."
    garden_logic_relevance: "Alternative governance model for the merge boundary. Instead of steward-governed, the commons could be cooperative-governed. Tests whether A(DAI)'s founding team model scales."

  # Attention Economy additions
  - id: 61
    name: "Kate Crawford — Atlas of AI (2021)"
    type: attention-critique
    brief: "AI as extractive industry. Supply chains from mines to data centers to clickworkers. Material politics of computation."
    garden_logic_relevance: "The material critique A(DAI)'s architecture doesn't address. The system runs on Claude API calls, hosted on cloud infrastructure, powered by mining and labor. The garden has supply chains."

  - id: 62
    name: "Crawford & Joler — Calculating Empires (2023)"
    type: provocation
    brief: "24-meter genealogy of technology and power, 1500-2025. Communication/computation + control/classification. Silver Lion Venice 2025."
    garden_logic_relevance: "The deep-historical frame for A(DAI)'s myth prompts. If the sensing layer runs CLA at the narrative level, Calculating Empires shows what 500 years of that analysis looks like."

  - id: 63
    name: "AI Attention Economy Ouroboros (2025)"
    type: attention-critique
    brief: "AI consuming its own AI-generated content creates recursive quality degradation. The attention economy's greatest success is its ultimate failure."
    garden_logic_relevance: "The self-referentiality risk. If A(DAI)'s prompts generate intelligence that becomes signals that generate more prompts, the system must prevent ouroboros. The Ralph pattern (fresh context each call) is a partial safeguard."

  # Artistic Precedents additions
  - id: 64
    name: "Holly Herndon — The Call (Serpentine, 2024-2025)"
    type: provocation
    brief: "AI choral models trained on consented UK choir recordings. Choirs as co-owners of training data. Collective consent at scale."
    garden_logic_relevance: "Updates Herndon's trajectory in the graph. Moves from individual consent (Holly+) to collective consent (The Call). The commons orientation field should reflect this evolution."

  - id: 65
    name: "Lev Manovich — Cultural Analytics (2007-2025)"
    type: provocation
    brief: "Computational cultural analytics. Data science applied to contemporary culture. Recent work on generative AI and aesthetics."
    garden_logic_relevance: "The methodological ancestor. Manovich does cultural field analysis computationally. A(DAI) adds the intention layer — not just analyzing the field but diagnosing its structural commitments."

  # Sensing additions
  - id: 66
    name: "Robert Rosen — Anticipatory Systems (1985, renewed 2024)"
    type: sensing
    brief: "Category-theoretic framework. Living systems act on internal models of themselves. Anticipation as fundamental property of life."
    garden_logic_relevance: "The mathematical foundation for the sensing loop. Rosen's anticipatory system contains an internal model and acts before stimuli arrive. A(DAI)'s dream cycle IS an anticipatory system — it models the graph's future state."

  - id: 67
    name: "Maturana & Varela — Autopoiesis (1972)"
    type: sensing
    brief: "Self-maintaining, self-producing systems. Operationally closed but structurally coupled with environment."
    garden_logic_relevance: "A(DAI) as autopoietic system: it produces the signals (prompts) that maintain its own structure (the graph). But Haraway's critique applies: 'nothing makes itself.' The garden is sympoietic — it makes-with contributors."

  - id: 68
    name: "ScenarioDNA — Culture Mapping"
    type: sensing
    brief: "Patented method decoding meaning across language, image, behavior. Blends semiotics, systems thinking, computational linguistics."
    garden_logic_relevance: "Closest commercial analogue to A(DAI)'s sensing ambition. Tests what happens when cultural sensing is commercialized. The attention economy leaked in here — ScenarioDNA serves brands."

  - id: 69
    name: "Sitra Weak Signals (Finland)"
    type: sensing
    brief: "Institutional weak signal scanning using PESTEC + VERGE. Emphasizes that weak signals challenge assumptions and increase future capacity."
    garden_logic_relevance: "Institutional precedent for what A(DAI)'s pulse cycle does. Sitra is a government-funded futures organization. Tests whether intention-based sensing survives institutionalization."

  - id: 70
    name: "Ronald Burt — Structural Holes Theory (1992)"
    type: sensing
    brief: "Network theory of brokerage advantage at gaps between clusters. Competitive advantage from bridging disconnected groups."
    garden_logic_relevance: "The coherence prompt's theoretical foundation. Burt's structural holes = A(DAI)'s disconnected clusters. But Burt frames holes as competitive advantage (attention). A(DAI) frames them as coherence failures (intention)."

  - id: 71
    name: "Donna Haraway — Sympoiesis / Making-With"
    type: sensing
