topic: "Tyson Yunkaporta's Agent Complexity Protocols"
description: >
  Research into Tyson Yunkaporta's Indigenous complexity framework — primarily the
  four operating protocols for agents in complex adaptive systems (Diversify, Connect,
  Interact, Adapt) derived from Aboriginal relational ontology, plus adjacent protocols
  (RCRD, Bigaagarri, Deep Time Diligence) and institutional work (IKS Lab, IP//AI Lab).
  Not a single named framework but a distributed body of work across Sand Talk, Right
  Story Wrong Story, Snake Talk, academic papers, and the Cynefin collaboration.

items:
  # --- Core Protocols ---
  - id: four-protocols
    name: "Four Protocols of Sustainability Agents (Diversify, Connect, Interact, Adapt)"
    description: >
      The canonical formulation from Sand Talk. Operating protocols for an agent in a
      complex adaptive system, derived from Aboriginal pronoun systems. Adaptation is
      identified as the most important. Self-organization emerges when agents follow all four.
    source: "Sand Talk (2019), Ch. on complexity"

  - id: rcrd-protocol
    name: "RCRD Knowledge Creation Protocol (Respect, Connect, Reflect, Direct)"
    description: >
      Four-step protocol for collaborative knowledge building. Respect = align values;
      Connect = build relationships; Reflect = think collectively; Direct = act on shared
      knowledge. Applicable to agent-to-agent knowledge transfer design.
    source: "Sand Talk (2019)"

  - id: bigaagarri
    name: "Bigaagarri Protocol"
    description: >
      Gumbaynggirr concept framing danger as environmental signalling within bio-cultural
      systems — experienced as shared relational phenomenon, not individual fight-flight.
      Published 2025 (Orcher, Palmer, Yunkaporta in MDPI Social Sciences).
    source: "MDPI Social Sciences 14(1):27, 2025"

  - id: deep-time-diligence
    name: "Deep Time Diligence"
    description: >
      Collective catastrophic risk analysis — multiple people with contradictory, overlapping
      data sets using group computational power to analyze system trajectories. Contrasted
      with prophecy or prediction.
    source: "Emergence Magazine interview, 2024"

  # --- Foundational Texts ---
  - id: sand-talk
    name: "Sand Talk: How Indigenous Thinking Can Save the World (2019)"
    description: >
      Foundation text. Introduces pattern thinking, complexity protocols, custodial agency,
      Aboriginal pronoun-based relational ontology, yarning, and the four agent protocols.
    source: "Text Publishing, 2019"

  - id: right-story-wrong-story
    name: "Right Story, Wrong Story (2023)"
    description: >
      Extends Sand Talk into narrative protocols, wrong-story traps, and relational
      accountability. Explores how stories function as living structures.
    source: "Text Publishing, 2023"

  - id: snake-talk
    name: "Snake Talk (forthcoming, September 2025)"
    description: >
      Third book in trilogy, co-authored with Megan Kelleher. Global serpent stories as
      lens for complexity, AI, immigration, and regenerative patterns. Kelleher's RMIT
      research investigates blockchain-Indigenous knowledge system interfaces.
    source: "Text Publishing, September 2025"

  # --- Conceptual Framework ---
  - id: pronoun-ontology
    name: "Aboriginal Pronoun-Based Relational Ontology"
    description: >
      Key insight: Aboriginal pronouns (us-two, us-only, us-all, us-belonging-to) encode
      operating protocols for agents in complex systems. Language itself is the protocol layer.
    source: "Sand Talk; Jim Rutt Show Ep65"

  - id: custodial-agency
    name: "Custodial vs. Extractive Agency"
    description: >
      Distinction between agents that maintain/regenerate systems (custodial species) vs.
      those that extract value. Humans as custodial species is a core premise.
    source: "Sand Talk; Garland Magazine essay"

  - id: pattern-thinking
    name: "Pattern Thinking (vs. Linear Thinking)"
    description: >
      Aboriginal cognitive framework seeing reality as dynamic patterns rather than linear
      cause-effect chains. Foundation for non-linear agent reasoning.
    source: "Sand Talk"

  - id: wrong-story-detection
    name: "Wrong-Story Detection"
    description: >
      Protocol for identifying when narratives/framings distort system understanding.
      Stories are living structures with their own integrity requirements.
    source: "Right Story, Wrong Story (2023)"

  - id: heterarchical-systems
    name: "Heterarchical Systems / Anti-Hierarchy Principle"
    description: >
      Complex systems are heterarchical (equal parts interacting). Imposing hierarchical
      top-down control can only destroy them. Self-organization is emergent, not directed.
    source: "Sand Talk"

  - id: fractal-governance
    name: "Fractal Governance"
    description: >
      Indigenous governance as fractal — self-similar patterns of authority repeating at
      different scales. Authority is contextual (knowledge-based, not positional).
    source: "Future Fossils podcast #172, 2021"

  - id: ontopunk
    name: "Ontopunk"
    description: >
      Practice of questioning/disrupting ontological assumptions, particularly W.E.I.R.D.
      modernity's foundational categories. Applied to how agents question framing assumptions.
    source: "Future Fossils podcast #172"

  # --- Methods & Processes ---
  - id: yarning-protocol
    name: "Yarning Protocol"
    description: >
      Structured conversational method from Aboriginal knowledge systems. Non-linear,
      relational, pattern-seeking. Operational methodology for the IKS Lab.
    source: "Sand Talk; IKS Lab practice"

  - id: circle-work
    name: "Circle Work Process (Us-Only / Us-Two / Us-All)"
    description: >
      IKS Lab operational methodology. Closed circle (us-only) for Indigenous-led exchange;
      paired work (us-two); open collective (us-all). Each level carries different
      accountability and knowledge-sharing protocols.
    source: "Coopes & Davis, JABSC 2022"

  - id: eight-ways
    name: "Eight Ways Aboriginal Pedagogy Framework"
    description: >
      Yunkaporta's earlier framework (2009): eight interconnected learning modalities.
      Predates Sand Talk and provides pedagogical substrate for later complexity work.
    source: "8ways.online; Yunkaporta 2009"

  # --- Institutional / Collaborative ---
  - id: iks-lab
    name: "IKS Lab (Deakin University)"
    description: >
      Indigenous Knowledge Systems Lab at Deakin. Research hub for applying Indigenous
      protocols to contemporary systems. Led by Yunkaporta and collaborators.
    source: "Deakin University"

  - id: ip-ai-lab
    name: "Indigenous Protocols and AI Laboratory (IP//AI Lab)"
    description: >
      Led by Abdilla, Yunkaporta, Kelleher. Produced 'Out of the Black Box: Indigenous
      Protocols for AI' (2021, UNESCO/ANAT). Indigenous AI should be regional, guided by
      local Indigenous laws.
    source: "indigenousprotocols.ai; ANAT 2021"

  - id: cynefin-yarns
    name: "Cynefin-IKS Lab Collaboration (Re-emergence Yarns)"
    description: >
      Four structured yarns between Yunkaporta/Marshall and Snowden/Smith (2023-2024).
      Cross-paradigm dialogue between Cynefin complexity framework and Aboriginal systems.
    source: "thecynefin.co; cynefinaustralia.au"

  - id: governance-paper
    name: "Governance Protocol Paper (Fletcher et al., 2023)"
    description: >
      'Indigenous systems knowledge applied to protocols for governance and inquiry'
      (Systems Research and Behavioral Science). Governance as communities of communities
      embedded in land.
    source: "Wiley, 2023"

  - id: non-indigenous-protocols
    name: "Protocols for Non-Indigenous People Working with Indigenous Knowledge (2024)"
    description: >
      Practical guide for ethical collaboration. Establishes boundary conditions for
      non-Indigenous engagement — directly relevant to AI system access constraints.
    source: "IKS Labs / AIME / Indigenous Commons, 2024"

  # --- Adjacent / Extensions ---
  - id: hoodie-economics
    name: "Hoodie Economics / Relational Economy Framework"
    description: >
      Manning Bancroft (AIME) extends Yunkaporta's complexity thinking into economics.
      Relational economies over transactional ones.
    source: "Manning Bancroft, 2023"

  - id: place-based-complexity
    name: "Place-Based Complexity / Country"
    description: >
      Knowledge and agency are always situated. Universal protocols fail in complex systems.
      'Country' as a living, relational system — not a backdrop but an agent.
    source: "Sand Talk; IP//AI Lab"

execution:
  batch_size: 3
  items_per_agent: 5
  output_dir: ./results
