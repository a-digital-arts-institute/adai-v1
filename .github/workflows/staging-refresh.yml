name: staging-refresh

# Nightly fresh copy of the prod DB on adai-staging. entrypoint.sh restores
# on the first boot after 03:00 UTC, so a stopped machine refreshes when it
# next wakes; this restarts a machine that is running so it refreshes now.
# A data=keep switch (src/utils/staging.ts) makes the restart a no-op.
#
# Required secret: FLY_API_TOKEN with access to adai-staging.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: staging-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for id in $(flyctl machine list --app adai-staging --json | jq -r '.[] | select(.state == "started") | .id'); do
            echo "restarting $id"
            flyctl machine restart "$id" --app adai-staging
          done
