app = 'adai-basel'
primary_region = 'fra'

[build]

[[mounts]]
source = 'data'
destination = '/data'
initial_size = '1gb'
processes = ['app']

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
# Keep one machine always warm so visitors never hit a cold-start boot (the
# main first-hit latency). auto_stop still applies to any machines above this
# floor. Flip back to 0 to scale-to-zero when not actively demoing.
min_machines_running = 1
processes = ['app']

# Health check — lets fly-proxy detect a sick instance and stop routing to it,
# and is the prerequisite for automatic failover once more than one machine runs.
# Probes the cheap JSON stats endpoint. grace_period covers the first-boot reseed
# (entrypoint copies the baked seed.db onto an empty volume, ~10s).
[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '30s'
method = 'GET'
path = '/api/stats'

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
