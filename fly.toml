app = 'adai-basel'
primary_region = 'fra'

[build]

[[mounts]]
source = 'data'
destination = '/data'
initial_size = '1gb'
processes = ['app']

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
