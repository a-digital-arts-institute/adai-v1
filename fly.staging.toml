# adai-staging — the `staging` branch, running on a nightly copy of the prod DB.
# Deployed by .github/workflows/staging-deploy.yml after CI passes on that
# branch (`just staging-promote` moves it to main), or
# by hand with `just staging-deploy` (any branch). Same image as prod;
# ADAI_ENV=staging makes entrypoint.sh restore-only (never replicates) and puts
# every outward integration behind a switch (src/utils/staging.ts).
app = 'adai-staging'
primary_region = 'fra'

[build]

[env]
ADAI_ENV = 'staging'
ADAI_BASE_URL = 'https://adai-staging.fly.dev'
WORKER_ADAI_URL = 'https://adai-staging.fly.dev'

[[mounts]]
source = 'data'
destination = '/data'
initial_size = '1gb'
processes = ['app']

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

# grace_period covers a boot that restores the DB from the replica first.
[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '120s'
method = 'GET'
path = '/api/stats'

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
